name: Build APK VEXOR

on:
  workflow_dispatch:
    inputs:
      appsheet_url:
        description: 'URL AppSheet del cliente'
        required: true
        type: string
      app_name:
        description: 'Nombre de la App'
        required: true
        type: string
      icon_base64:
        description: 'Icono en Base64 (opcional)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Limpiar y Reemplazar URL AppSheet
        run: |
          URL_CRUDO="${{ inputs.appsheet_url }}"
          echo "URL cruda: $URL_CRUDO"
          URL_LIMPIA=$(echo "$URL_CRUDO" | cut -d'#' -f1 | cut -d'&' -f1)
          URL_LIMPIA=$(echo "$URL_LIMPIA" | sed 's/platform=desktop/platform=mobile/g')
          if [[ "$URL_LIMPIA" != *"platform=mobile"* ]]; then
            if [[ "$URL_LIMPIA" == *"?"* ]]; then
              URL_LIMPIA="${URL_LIMPIA}&platform=mobile"
            else
              URL_LIMPIA="${URL_LIMPIA}?platform=mobile"
            fi
          fi
          echo "URL limpia: $URL_LIMPIA"
          sed -i "s|https://www.appsheet.com/start/.*|${URL_LIMPIA}\";|g" app/src/main/java/com/example/appsheetvexor/MainActivity.java
          grep -n "APPSHEET_URL" app/src/main/java/com/example/appsheetvexor/MainActivity.java

      - name: Reemplazar nombre de la App
        run: |
          sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">${{ inputs.app_name }}<\/string>/g" app/src/main/res/values/strings.xml

      - name: Reemplazar icono
        if: inputs.icon_base64 != ''
        run: |
          echo "${{ inputs.icon_base64 }}" | base64 --decode > icono_cliente.png
          rm -rf app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          for d in hdpi mdpi xhdpi xxhdpi xxxhdpi; do
            cp icono_cliente.png app/src/main/res/mipmap-$d/ic_launcher.png
            cp icono_cliente.png app/src/main/res/mipmap-$d/ic_launcher_round.png
            cp icono_cliente.png app/src/main/res/mipmap-$d/ic_launcher.webp
            cp icono_cliente.png app/src/main/res/mipmap-$d/ic_launcher_round.webp
          done

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-APK
          path: app/build/outputs/apk/debug/app-debug.apk
