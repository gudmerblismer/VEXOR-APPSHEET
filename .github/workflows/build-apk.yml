name: VEXOR APK Builder

on:
  workflow_dispatch:
    inputs:
      appName:
        description: 'Nombre de la App'
        required: true
        default: 'NEXO'
      appUrl:
        description: 'Link AppSheet'
        required: true
        default: 'https://www.appsheet.com/start/06effb1c-9afa-464d-9b0e-5db6e583136b?platform=mobile'
      iconBase64:
        description: 'Icono WEBP base64'
        required: false
      mapeosJson:
        description: 'Mapeos JSON ej: {"DATA STUDIO":"https://..."}'
        required: false
        default: '{}'
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Procesar datos - ID UNICO POR APP + URL + MAPEOS FIJOS ILIMITADOS
        run: |
          APP_NAME="${{ github.event.inputs.appName || github.event.client_payload.appName || 'NEXO' }}"
          APP_URL="${{ github.event.inputs.appUrl || github.event.client_payload.appUrl }}"
          ICON_B64="${{ github.event.inputs.iconBase64 || github.event.client_payload.iconBase64 }}"
          MAPEOS_JSON_RAW='${{ github.event.inputs.mapeosJson || github.event.client_payload.mapeosJson || '{}' }}'
          
          # Si viene vacio poner uno por defecto
          if [ -z "$MAPEOS_JSON_RAW" ] || [ "$MAPEOS_JSON_RAW" = "" ]; then
            MAPEOS_JSON_RAW='{"DATA STUDIO":"https://datastudio.google.com/embed/reporting/a9a7f8c7-b820-4b17-9e6b-b6168d82d175/page/jfW6F"}'
          fi
          
          echo "=== DATOS RECIBIDOS ==="
          echo "APP_NAME: $APP_NAME"
          echo "APP_URL: $APP_URL"
          echo "MAPEOS_JSON_RAW: $MAPEOS_JSON_RAW"
          
          # Hash corto de la URL para diferenciar apps con mismo nombre pero diferente URL
          URL_HASH=$(echo -n "$APP_URL" | md5sum | cut -c1-6)
          SANITIZED=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '_' | sed 's/^_*//;s/_*$//' | cut -c1-15)
          if [ -z "$SANITIZED" ]; then SANITIZED="app"; fi
          APP_ID="com.vexor.${SANITIZED}_${URL_HASH}"
          
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          echo "APP_URL=$APP_URL" >> $GITHUB_ENV
          echo "APP_ID=$APP_ID" >> $GITHUB_ENV
          echo "URL_HASH=$URL_HASH" >> $GITHUB_ENV
          echo "MAPEOS_JSON_RAW=$MAPEOS_JSON_RAW" >> $GITHUB_ENV
          echo "Generando APP_ID: $APP_ID para APP: $APP_NAME con URL: $APP_URL"

          if [ -f "app/src/main/res/values/strings.xml" ]; then
            sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$APP_NAME</string>|g" app/src/main/res/values/strings.xml
          fi

          if [ -f "app/build.gradle" ]; then
            sed -i "s/applicationId \".*\"/applicationId \"$APP_ID\"/g" app/build.gradle
            sed -i "s/applicationId '.*'/applicationId \"$APP_ID\"/g" app/build.gradle
          fi
          if [ -f "app/build.gradle.kts" ]; then
            sed -i "s/applicationId = \".*\"/applicationId = \"$APP_ID\"/g" app/build.gradle.kts
          fi

          if [ ! -z "$ICON_B64" ]; then
            mkdir -p app/src/main/res/mipmap-xxxhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi
            echo "$ICON_B64" | base64 -d > app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp
            cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp app/src/main/res/mipmap-xxhdpi/ic_launcher.webp
            cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp app/src/main/res/mipmap-xhdpi/ic_launcher.webp
            cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp app/src/main/res/mipmap-hdpi/ic_launcher.webp
            cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp app/src/main/res/mipmap-mdpi/ic_launcher.webp
            cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.webp
            cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp app/src/main/res/mipmap-xxhdpi/ic_launcher_round.webp
            cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp app/src/main/res/mipmap-xhdpi/ic_launcher_round.webp
          fi

          # === INYECCION DE MAPEOS FIJOS ILIMITADOS ===
          echo "=== INYECTANDO MAPEOS FIJOS ==="
          MAIN_FILE="app/src/main/java/com/example/appsheetvexor/MainActivity.java"
          if [ -f "$MAIN_FILE" ]; then
            # Usar Python para escapar correctamente el JSON para Java
            MAPEOS_ESCAPED=$(python3 -c "
          import json, sys
          raw = '''$MAPEOS_JSON_RAW'''
          try:
              obj = json.loads(raw)
              json_str = json.dumps(obj)
              # Escapar comillas para Java string
              escaped = json_str.replace('\"', '\\\\\"')
              print(escaped)
          except Exception as e:
              print('{\\\"DATA STUDIO\\\":\\\"https://datastudio.google.com/embed/reporting/a9a7f8c7-b820-4b17-9e6b-b6168d82d175/page/jfW6F\\\"}')
          ")
            echo "MAPEOS_ESCAPED: $MAPEOS_ESCAPED"
            
            # Reemplazar la linea completa de MAPEOS_FIJOS_JSON
            # Metodo 1: sed directo
            sed -i "s|private static final String MAPEOS_FIJOS_JSON = \".*\";|private static final String MAPEOS_FIJOS_JSON = \"$MAPEOS_ESCAPED\";|g" "$MAIN_FILE"
            
            echo "MAPEOS inyectados correctamente"
            grep -n "MAPEOS_FIJOS_JSON" "$MAIN_FILE" || echo "No se encontro la linea, verificando..."
          else
            echo "No se encontro MainActivity.java en $MAIN_FILE"
          fi

          # Reemplazar AppSheet URL en todos los archivos
          find app/src/main -type f \( -name "*.kt" -o -name "*.java" \) | xargs grep -l "appsheet.com" 2>/dev/null | while read f; do
            sed -i "s|https://www.appsheet.com/start/[^\"']*|$APP_URL|g" "$f"
          done

      - name: Build APK Debug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Renombrar APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          FINAL_NAME="${{ env.APP_NAME }}-${{ env.URL_HASH }}-VEXOR-${{ github.run_number }}.apk"
          FINAL_NAME=$(echo "$FINAL_NAME" | tr -cs 'a-zA-Z0-9._-' '_' )
          cp "$APK" "$FINAL_NAME"
          echo "APK_FILE=$FINAL_NAME" >> $GITHUB_ENV

      - name: Crear Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_ID }}-v${{ github.run_number }}
          name: ${{ env.APP_NAME }} v${{ github.run_number }} (${{ env.APP_ID }})
          body: |
            App: ${{ env.APP_NAME }}
            Package: ${{ env.APP_ID }}
            URL: ${{ env.APP_URL }}
            Mapeos: ${{ env.MAPEOS_JSON_RAW }}
            Hash URL: ${{ env.URL_HASH }}
            Build: ${{ github.run_number }}
            Ahora soporta mapeos fijos ilimitados dentro del codigo
          files: ${{ env.APK_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.URL_HASH }}-APK-${{ github.run_number }}
          path: ${{ env.APK_FILE }}
          retention-days: 30
