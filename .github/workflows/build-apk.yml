name: Build APK VEXOR
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nombre app'
        required: true
      appsheet_url:
        description: 'Link AppSheet'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Java 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v2

      - name: Fix gradlew
        run: chmod +x gradlew

      - name: Replace app name and url
        run: |
          echo "App: ${{ inputs.app_name }}"
          find app/src -type f -name "*.xml" -o -name "*.java" | xargs sed -i "s|NEXO|${{ inputs.app_name }}|g" || true
          find app/src -type f -name "*.java" | xargs sed -i "s|https://www.appsheet.com/start/[^ ]*|${{ inputs.appsheet_url }}|g" || true

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: ${{ inputs.app_name }}-APK
          path: app/build/outputs/apk/debug/*.apk
