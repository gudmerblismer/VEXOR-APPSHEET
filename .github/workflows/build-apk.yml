name: Build APK VEXOR

on:
  workflow_dispatch:
    inputs:
      appsheet_url:
        description: 'URL AppSheet del cliente'
        required: true
        type: string
      app_name:
        description: 'Nombre de la App'
        required: true
        type: string
      icon_base64:
        description: 'Icono en Base64 (opcional)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Limpiar y Reemplazar URL AppSheet
        run: |
          URL_CRUDO="${{ inputs.appsheet_url }}"
          echo "URL cruda de Blogger: $URL_CRUDO"
          
          # 1. Quitar todo desde # (quita #appName y vss)
          URL_LIMPIA=$(echo "$URL_CRUDO" | cut -d'#' -f1)
          # 2. Quitar &vss y todo lo que sigue si existe
          URL_LIMPIA=$(echo "$URL_LIMPIA" | cut -d'&' -f1)
          # 3. Cambiar platform=desktop por platform=mobile
          URL_LIMPIA=$(echo "$URL_LIMPIA" | sed 's/platform=desktop/platform=mobile/g')
          
          # 4. Si no tiene platform=mobile, agregarlo
          if [[ "$URL_LIMPIA" != *"platform=mobile"* ]]; then
            if [[ "$URL_LIMPIA" == *"?"* ]]; then
              URL_LIMPIA="${URL_LIMPIA}&platform=mobile"
            else
              URL_LIMPIA="${URL_LIMPIA}?platform=mobile"
            fi
          fi
          
          echo "URL limpia final: $URL_LIMPIA"
          
          # 5. Reemplazar en MainActivity.java (usa la plantilla exacta)
          sed -i "s|https://www.appsheet.com/start/.*|${URL_LIMPIA}\";|g" app/src/main/java/com/example/appsheetvexor/MainActivity.java
          
          echo "--- Verificando MainActivity.java ---"
          grep -n "APPSHEET_URL" app/src/main/java/com/example/appsheetvexor/MainActivity.java

      - name: Reemplazar nombre de la App
        run: |
          echo "Nombre nuevo: ${{ inputs.app_name }}"
          sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">${{ inputs.app_name }}<\/string>/g" app/src/main/res/values/strings.xml
          cat app/src/main/res/values/strings.xml

      - name: Reemplazar icono del cliente
        if: inputs.icon_base64 != ''
        run: |
          echo "Creando icono desde Base64..."
          echo "${{ inputs.icon_base64 }}" | base64 --decode > icono_cliente.png
          
          # Borrar TODOS los iconos viejos que dan error de logo_vexor
          rm -rf app/src/main/res/mipmap-hdpi
          rm -rf app/src/main/res/mipmap-mdpi
          rm -rf app/src/main/res/mipmap-xhdpi
          rm -rf app/src/main/res/mipmap-xxhdpi
          rm -rf app/src/main/res/mipmap-xxxhdpi
          rm -rf app/src/main/res/mipmap-anydpi-v26
          
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          
          # Copiar icono del cliente a todas las densidades
          for d in hdpi mdpi xhdpi xxhdpi xxxhdpi; do
            cp icono_cliente.png app/src/main/res/mipmap-$d/ic_launcher.png
            cp icono_cliente.png app/src/main/res/mipmap-$d/ic_launcher_round.png
            cp icono_cliente.png app/src/main/res/mipmap-$d/ic_launcher.webp
            cp icono_cliente.png app/src/main/res/mipmap-$d/ic_launcher_round.webp
          done
          
          echo "Iconos nuevos creados"
          ls -R app/src/main/res/mipmap-*

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v3
        with:
          name: ${{ inputs.app_name }}-APK
          path: app/build/outputs/apk/debug/app-debug.apk
