name: Build APK por cliente (Vexor)

# Se dispara manualmente o vía API (llamado desde Apps Script con un
# Personal Access Token) pasando los datos del cliente como "inputs".
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nombre de la app (ej: NEXO Ventas Pro)"
        required: true
      appsheet_url:
        description: "Link de inicio de AppSheet del cliente"
        required: true
      icon_url:
        description: "URL pública del icono (PNG 512x512, ej: link de Google Drive en formato descarga directa)"
        required: true
      email_cliente:
        description: "Email del cliente (para el correo de entrega)"
        required: false
        default: ""
      row:
        description: "Número de fila en la hoja de cálculo (para que Apps Script sepa qué fila actualizar)"
        required: false
        default: ""

permissions:
  contents: write # necesario para crear el Release con el APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias de Python
        run: pip install --quiet pillow google-api-python-client google-auth

      - name: Inyectar nombre de app y link de AppSheet del cliente
        run: |
          python3 scripts/apply_client_config.py \
            "${{ github.event.inputs.app_name }}" \
            "${{ github.event.inputs.appsheet_url }}"

      - name: Generar iconos del cliente
        run: |
          python3 scripts/generate_icons.py \
            "${{ github.event.inputs.icon_url }}" \
            "app/src/main/res"

      - name: Preparar sufijo de applicationId (uno por cliente)
        id: appid
        run: |
          SAFE=$(echo "${{ github.event.inputs.app_name }}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/_/g' | sed -E 's/^_+|_+$//g')
          echo "suffix=cliente_${SAFE}" >> "$GITHUB_OUTPUT"

      - name: Decodificar keystore de firma
        if: ${{ secrets.VEXOR_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.VEXOR_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Dar permisos a gradlew
        run: chmod +x ./gradlew

      - name: Compilar APK firmado
        env:
          VEXOR_KEYSTORE_PATH: ${{ secrets.VEXOR_KEYSTORE_BASE64 != '' && format('{0}/release.keystore', github.workspace) || '' }}
          VEXOR_KEYSTORE_PASSWORD: ${{ secrets.VEXOR_KEYSTORE_PASSWORD }}
          VEXOR_KEY_ALIAS: ${{ secrets.VEXOR_KEY_ALIAS }}
          VEXOR_KEY_PASSWORD: ${{ secrets.VEXOR_KEY_PASSWORD }}
          VEXOR_APP_ID_SUFFIX: ${{ steps.appid.outputs.suffix }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Renombrar APK final
        id: apk
        run: |
          SAFE=$(echo "${{ github.event.inputs.app_name }}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/_/g' | sed -E 's/^_+|_+$//g')
          STAMP=$(date +%Y%m%d_%H%M%S)
          SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          DEST="vexor_${SAFE}_${STAMP}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "tag=apk-${SAFE}-${STAMP}" >> "$GITHUB_OUTPUT"

      - name: Subir APK como artifact del workflow
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.path }}
          path: ${{ steps.apk.outputs.path }}

      - name: Publicar APK en un GitHub Release (respaldo interno)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: "${{ github.event.inputs.app_name }}"
          files: ${{ steps.apk.outputs.path }}
          body: "APK generado automáticamente para ${{ github.event.inputs.app_name }}."

      - name: Subir APK a Google Drive (link público, sin necesidad de cuenta de GitHub)
        id: drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.VEXOR_GDRIVE_SA_KEY }}
        run: |
          python3 scripts/upload_to_drive.py \
            "${{ steps.apk.outputs.path }}" \
            "${{ steps.apk.outputs.path }}" \
            "${{ secrets.VEXOR_GDRIVE_FOLDER_ID }}"

      - name: Avisar a Apps Script (actualizar Sheet + enviar email al cliente)
        if: ${{ secrets.VEXOR_CALLBACK_URL != '' }}
        run: |
          curl -s -X POST "${{ secrets.VEXOR_CALLBACK_URL }}" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "action": "apk_listo",
            "row": "${{ github.event.inputs.row }}",
            "app_name": "${{ github.event.inputs.app_name }}",
            "email_cliente": "${{ github.event.inputs.email_cliente }}",
            "apk_link": "${{ steps.drive.outputs.direct_link }}",
            "apk_view_link": "${{ steps.drive.outputs.view_link }}"
          }
          EOF
