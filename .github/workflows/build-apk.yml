name: Build APK VEXOR
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nombre de la app'
        required: true
      appsheet_url:
        description: 'Link AppSheet'
        required: true
  # NO se ejecuta con push de iconos
  push:
    branches: [main]
    paths-ignore:
      - 'app/src/main/res/mipmap-**'
      - '**.png'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Reemplazar solo NOMBRE y LINK
        run: |
          echo "App: ${{ inputs.app_name }}"
          # Si viene de push, usa valores por defecto
          APP_NAME="${{ inputs.app_name }}"
          APP_URL="${{ inputs.appsheet_url }}"
          if [ -z "$APP_NAME" ]; then APP_NAME="NEXO"; fi
          if [ -z "$APP_URL" ]; then APP_URL="https://www.appsheet.com/start/06effb1c-9afa-464d-9b0e-5db6e583136b?platform=mobile"; fi

          sed -i "s|APP_NAME_PLACEHOLDER|$APP_NAME|g" app/src/main/res/values/strings.xml || true
          sed -i "s|AppSheet Vexor|$APP_NAME|g" app/src/main/AndroidManifest.xml || true
          sed -i "s|URL_PLACEHOLDER|$APP_URL|g" app/src/main/java/com/example/appsheetvexor/MainActivity.java || true
          sed -i "s|https://www.appsheet.com/start/06effb1c-9afa-464d-9b0e-5db6e583136b?platform=mobile|$APP_URL|g" app/src/main/java/com/example/appsheetvexor/MainActivity.java || true

      - name: Build APK
        run: chmod +x gradlew &&./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-APK
          path: app/build/outputs/apk/debug/app-debug.apk
