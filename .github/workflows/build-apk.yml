name: Build APK VEXOR
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nombre de la App'
        required: true
      appsheet_url:
        description: 'Link AppSheet'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: ELIMINAR ICONOS VIEJOS Y VERIFICAR ICONO CLIENTE
        run: |
          echo "=== Borrando TODOS los PNG duplicados viejos ==="
          find app/src/main/res -name "*.png" -delete || true
          find app/src/main/res -name "*.jpg" -delete || true
          find app/src/main/res -name "*.jpeg" -delete || true
          
          echo "=== Iconos que quedan (solo debe haber WEBP del cliente) ==="
          ls -R app/src/main/res/mipmap-*/ | grep -E "webp|png"
          
          echo "=== Verificando que el cliente subio icono desde la web ==="
          if [ ! -f "app/src/main/res/mipmap-mdpi/ic_launcher.webp" ]; then
            echo "::error::NO HAY ICONO DEL CLIENTE. El cliente debe subir icono desde la pagina web."
            exit 1
          fi
          
          echo "✅ Icono del cliente encontrado, continuando build..."

      - name: Reemplazar Nombre y URL
        run: |
          sed -i "s|https://www.appsheet.com/start/06effb1c-9afa-464d-9b0e-5db6e583136b?platform=mobile|${{ inputs.appsheet_url }}|g" app/src/main/java/com/example/appsheetvexor/MainActivity.java || true
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">${{ inputs.app_name }}</string>|g" app/src/main/res/values/strings.xml || true

      - run: chmod +x ./gradlew
      - run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-APK
          path: app/build/outputs/apk/debug/app-debug.apk
